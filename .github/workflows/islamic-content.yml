name: Build Hadith & Quran content

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download hadith (HadeethEnc) and Quran verses (alquran.cloud)
        run: python3 tools/build_islamic_content.py
      - name: Commit updated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/hadith.json assets/data/quran_verses.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "Update hadith and Quran verse content"
          git push
